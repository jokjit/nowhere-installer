name: singbox-lite checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash scripts
        run: |
          bash -n singbox.sh advanced_relay.sh parser.sh xray_manager.sh tests/test-singbox-nowhere.sh
      - name: Exercise Nowhere support
        run: |
          bash tests/test-singbox-nowhere.sh
      - name: Exercise Alpine shell parsing
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work alpine:3.22 sh -c '
            apk add --no-cache bash jq openssl coreutils tar gzip
            bash -n singbox.sh advanced_relay.sh parser.sh xray_manager.sh tests/test-singbox-nowhere.sh
          '
